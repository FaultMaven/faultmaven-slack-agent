# Keep the pinned dependencies current.
#
# Every dependency in this repository is pinned exactly, and deliberately so:
# CI's lint and contract-drift jobs install specific versions of ruff and
# datamodel-code-generator to stay reproducible, and the runtime image is built
# from requirements.txt. The cost of that is that nothing moves on its own — a
# security advisory only surfaces as a warning on `git push`, which is how
# CVE-2025-71176 in pytest sat open for months (#55).
#
# Weekly, grouped so routine patch bumps arrive as one reviewable PR; minor
# and major bumps come on their own, because those are the ones that need a
# real look (e.g. SQLAlchemy 2.0→2.1 dropped greenlet from its default
# dependencies, breaking slack_sdk's asyncio import — caught only in CI).
version: 2
updates:
  - package-ecosystem: "pip"
    # Picks up both requirements.txt (runtime, shipped in the image) and
    # requirements-dev.txt (linter, model generator, test runner).
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      python-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Every action in .github/workflows/ is pinned to a commit sha, as in
  # FaultMaven/faultmaven#2185. Dependabot raises no security alert for an
  # action pinned that way, so this entry is the only signal that one has a
  # new release, fixes included. It updates the sha and the version comment
  # together. At most two pull requests a week: majors are grouped apart, so a
  # breaking major cannot hold back a patch.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
