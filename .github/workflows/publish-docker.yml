name: Publish Docker Image

# Publishes the Slack-agent image. The main-branch path runs only AFTER "CI"
# succeeds on a push (gates on the full lint + test + build), and builds the
# commit that run tested. A version tag (v*.*.*) or a manual dispatch publishes
# only a commit with a green "CI" push run: see "Resolve the commit to publish".
# Mirrors the faultmaven repo's
# publish-docker.yml so this app plugs into the same CI → Queue → Promote → CD
# pipeline (no kubectl in this repo; the image is deployed by
# faultmaven-enterprise-infra via promote-images + cd-pipeline).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: faultmaven-slack-agent

jobs:
  publish:
    runs-on: ubuntu-24.04
    # 60 runs to 2026-10-23: green max 1.2m on a warm cache; a cold build takes longer.
    timeout-minutes: 20
    # A workflow_run must come from a green PUSH run. The `branches` filter
    # above matches a head branch NAME, so a pull request from a fork whose
    # branch is called `main` passes it too, and this job checks out the
    # triggering run's commit, which for that run is the fork's code. Tags and
    # dispatches are checked against CI in "Resolve the commit to publish".
    if: >-
      ${{ (github.event_name == 'workflow_run'
           && github.event.workflow_run.conclusion == 'success'
           && github.event.workflow_run.event == 'push')
        || github.event_name == 'push'
        || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
      actions: read  # the CI-verdict lookup for a tag or a dispatch

    steps:
      # The commit this run publishes (FaultMaven/faultmaven#2185 made the same
      # change in core).
      #
      # workflow_run: the commit the triggering CI run tested, NOT github.sha.
      # For this event github.sha is main's tip when the run starts. On
      # 2026-10-21 four pushes landed within a minute; the publish runs that
      # CI on cf14a63, 9ad57d9 and 90a0d0e triggered each checked out main =
      # c2811b3 and pushed it before c2811b3's own CI had finished.
      #
      # A tag or a dispatch carries no CI verdict of its own, so it publishes
      # only a commit with a green "CI" run from a push.
      #
      # The moving tags (latest and the branch name) follow only the branch's
      # current tip, because CI runs can finish out of order: see "Move latest
      # and the branch tag". The sha- tag and the image queue (which orders
      # itself, below) take every green commit.
      - name: Resolve the commit to publish
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=100" \
              --jq '.workflow_runs | length')"
            if [ "$green" -eq 0 ]; then
              echo "::error::${SHA} has no successful CI run from a push; refusing to publish it"
              exit 1
            fi
          fi
          {
            echo "sha=${SHA}"
            echo "short=${SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # Not `type=sha`, and a revision label and annotation of our own:
          # metadata-action reads all three from github.sha, which is not the
          # commit built on a workflow_run. A custom label or annotation
          # replaces the generated one. (`context: git` would read the checkout
          # instead, but finds no ref for it: one commit, fetched without tags,
          # on a detached HEAD.)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.target.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
          # The default, latest=auto, adds `latest` to every non-prerelease
          # semver tag, so tagging an older green commit would move :latest
          # back to it. `latest` moves only in "Move latest and the branch tag".
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # `digest` comes from build-push-action; metadata-action has no such
      # output, so this line used to print an empty digest.
      - name: Image digest
        run: echo "Published image with digest ${{ steps.build.outputs.digest }}"

      # Cross-repo queue update via the faultmaven-infra-queue-bot GitHub App.
      # Runs only on the canonical repo's main.
      - name: Mint infra token (GitHub App)
        id: infra-token
        if: github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-slack-agent'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.INFRA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: faultmaven-enterprise-infra

      - name: Note skipped queue update (fork)
        if: github.ref == 'refs/heads/main' && github.repository != 'FaultMaven/faultmaven-slack-agent'
        run: echo "::warning::Not the canonical repo — skipping enterprise-infra image queue update (expected on forks)."

      # The queue writer is shared: FaultMaven/ci-actions/update-image-queue
      # checks out enterprise-infra's image-queue branch and records this
      # commit's sha- tag there, moving the queue only forward (its README
      # states the rule). This job keeps the mint, so the App's private key
      # never reaches the action.
      - name: Update image queue
        if: github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-slack-agent'
        uses: FaultMaven/ci-actions/update-image-queue@4bf2cb149a846580d86ec891504b255d49e07e2d # v1.0.0
        with:
          service: faultmaven-slack-agent
          sha: ${{ steps.target.outputs.sha }}
          token: ${{ steps.infra-token.outputs.token }}

      # Only `tags` is read from this step: the build pushes none of them.
      - name: Name the moving tags
        id: moving
        if: startsWith(github.ref, 'refs/heads/')
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
          flavor: |
            latest=false

      # Points latest and the branch tag at this build only if its commit is
      # the branch tip now (#130). Checked at job start, the answer went stale
      # while the image built: a newer commit's publish could finish in that
      # time, and this run's push then moved both tags back to an older one.
      # A commit pushed after this check needs its own CI run, over a minute,
      # before its publish can move them; this step takes seconds. Last, so a
      # failure here never holds back the image queue. A failed lookup leaves
      # the tags where they are; it does not fail the publish.
      - name: Move latest and the branch tag
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.moving.outputs.tags }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)" || tip=""
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::${GITHUB_REF_NAME} is at '${tip}', not ${SHA}; leaving latest and the branch tag where they are"
            exit 0
          fi
          args=()
          mapfile -t names <<< "$TAGS"
          for name in "${names[@]}"; do
            args+=(--tag "$name")
          done
          docker buildx imagetools create "${args[@]}" \
            "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}@${DIGEST}"
