name: Publish Docker Image

# Publishes the Slack-agent image. The main-branch path runs only AFTER "CI"
# succeeds (gates on the full lint + test + build). Version tags (v*.*.*) and
# manual dispatch publish directly and do NOT run through CI — use them only for
# commits already validated on main. Mirrors the faultmaven repo's
# publish-docker.yml so this app plugs into the same CI → Queue → Promote → CD
# pipeline (no kubectl in this repo; the image is deployed by
# faultmaven-enterprise-infra via promote-images + cd-pipeline).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: faultmaven-slack-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only when the triggering CI run passed (workflow_run), or a tag/manual run.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Published image with digest ${{ steps.meta.outputs.digest }}"

      # Cross-repo queue update via the faultmaven-infra-queue-bot GitHub App.
      # The App private key is a repo-level secret. Runs only on the canonical
      # repo's main.
      - name: Mint infra token (GitHub App)
        id: infra-token
        if: github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-slack-agent'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.INFRA_BOT_APP_ID }}
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: faultmaven-enterprise-infra

      - name: Note skipped queue update (fork)
        if: github.ref == 'refs/heads/main' && github.repository != 'FaultMaven/faultmaven-slack-agent'
        run: echo "::warning::Not the canonical repo — skipping enterprise-infra image queue update (expected on forks)."

      # The image queue moved to enterprise-infra's `image-queue` branch
      # (infra#408). This step checks out that branch, and the next one pushes it.
      - name: Checkout enterprise-infra
        if: github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-slack-agent'
        uses: actions/checkout@v6
        with:
          repository: FaultMaven/faultmaven-enterprise-infra
          ref: image-queue
          token: ${{ steps.infra-token.outputs.token }}
          path: enterprise-infra

      - name: Install yq
        if: github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-slack-agent'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # The queue only moves forward (infra#413). This run replaces the queued
      # entry only when its commit CONTAINS the queued one; GitHub's compare of
      # this repository, queued...this run, decides:
      #   ahead      this run is newer                 -> write
      #   identical  the queue already names it        -> skip
      #   behind     this run is older (an old rerun)  -> skip
      #   diverged   neither contains the other        -> refuse: a red run, for a person
      #   no answer  (the compare failed or said else) -> retry, then a red run
      # Four repositories push this branch, so a rejected push is an ordinary
      # race. It RE-READS origin's file and decides again, so the last writer
      # has always compared against the newest entry. It never rebases: two
      # runs of one repository rewrite the same three lines, and that rebase
      # stops on a conflict.
      - name: Update image queue
        if: github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-slack-agent'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERED_BY: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          cd enterprise-infra
          git config user.name "faultmaven-infra-queue-bot[bot]"
          git config user.email "faultmaven-infra-queue-bot[bot]@users.noreply.github.com"

          QUEUE_FILE="available-images/staging/faultmaven-slack-agent.yaml"
          RUN_SHA="$GITHUB_SHA"
          TAG="sha-${GITHUB_SHA:0:7}"
          REPO="$GITHUB_REPOSITORY"
          COMMIT_MSG="chore(queue): update faultmaven-slack-agent image to ${TAG}

          Built from: ${REPO}@${RUN_SHA}
          Triggered by: @${TRIGGERED_BY}
          Workflow: ${WORKFLOW_NAME}"
          ERR="$(mktemp)"
          trap 'rm -f "$ERR"' EXIT

          if [ ! -f "$QUEUE_FILE" ]; then
            echo "::error::Queue file not found: $QUEUE_FILE — register the service in faultmaven-enterprise-infra first."
            exit 1
          fi

          # Sets Q to the commit the queue names: commit_sha, else the sha-
          # tag's suffix, else empty. A yq failure returns 1 with REASON set.
          queued_commit() {
            local sha tag
            Q=""
            if ! sha="$(yq '.commit_sha // ""' "$QUEUE_FILE" 2>"$ERR")"; then
              REASON="could not read ${QUEUE_FILE}: $(awk 'NF { l = $0 } END { print l }' "$ERR")"
              return 1
            fi
            if [ -n "$sha" ]; then
              Q="$sha"
              return 0
            fi
            if ! tag="$(yq '.tag // ""' "$QUEUE_FILE" 2>"$ERR")"; then
              REASON="could not read ${QUEUE_FILE}: $(awk 'NF { l = $0 } END { print l }' "$ERR")"
              return 1
            fi
            case "$tag" in
              sha-?*) Q="${tag#sha-}" ;;
            esac
            return 0
          }

          # Sets DECISION (write, skip, refuse or retry) and REASON from the
          # queue file as it stands. gh's rc is read before its answer: a 404
          # prints its JSON body on stdout.
          decide() {
            local rc status
            DECISION=""
            REASON=""
            if ! queued_commit; then
              DECISION="retry"
              return 0
            fi
            if [ -z "$Q" ]; then
              DECISION="write"
              return 0
            fi
            if [ "$Q" = "$RUN_SHA" ]; then
              DECISION="skip"
              REASON="the queue already names this commit"
              return 0
            fi
            rc=0
            status="$(gh api "repos/${REPO}/compare/${Q}...${RUN_SHA}" --jq .status 2>"$ERR")" || rc=$?
            if [ "$rc" -ne 0 ]; then
              DECISION="retry"
              REASON="the compare ${Q}...${RUN_SHA} failed: $(awk 'NF { l = $0 } END { print l }' "$ERR")"
              return 0
            fi
            case "$status" in
              ahead)     DECISION="write" ;;
              identical) DECISION="skip";   REASON="the queued ${Q} is this commit" ;;
              behind)    DECISION="skip";   REASON="this run's commit is older than the queued ${Q}" ;;
              diverged)  DECISION="refuse"; REASON="neither commit contains the other" ;;
              *)         DECISION="retry";  REASON="the compare ${Q}...${RUN_SHA} answered '${status}'" ;;
            esac
          }

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] && ! { git fetch -q origin image-queue && git reset -q --hard FETCH_HEAD; }; then
              REASON="could not re-read origin/image-queue"
              echo "::warning::${REASON} (attempt ${attempt}/3)"
              sleep $((attempt * 2))
              continue
            fi
            decide
            case "$DECISION" in
              skip)
                echo "::notice::${REASON}; the queue keeps ${Q} in ${QUEUE_FILE}"
                {
                  echo "## Image queue"
                  echo ""
                  echo "\`${QUEUE_FILE}\` is unchanged: ${REASON}. It keeps \`${Q}\`; this run is \`${RUN_SHA}\`."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              refuse)
                echo "::error::${REASON}: ${QUEUE_FILE} names ${Q} and this run is ${RUN_SHA}. The queue is left as it is."
                exit 1
                ;;
              retry)
                echo "::warning::${REASON} (attempt ${attempt}/3)"
                sleep $((attempt * 2))
                ;;
              write)
                echo "Updating ${QUEUE_FILE} to ${TAG}"
                if ! { yq -i ".tag = \"${TAG}\"" "$QUEUE_FILE" &&
                       yq -i ".updated_at = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" "$QUEUE_FILE" &&
                       yq -i ".commit_sha = \"${RUN_SHA}\"" "$QUEUE_FILE" &&
                       git add "$QUEUE_FILE" &&
                       git commit -q -m "$COMMIT_MSG"; }; then
                  echo "::error::could not write ${QUEUE_FILE} in the checkout"
                  exit 1
                fi
                if git push origin image-queue; then
                  echo "✓ Updated image queue: ${TAG}"
                  exit 0
                fi
                REASON="the push to image-queue was rejected"
                echo "::warning::push rejected; recomputing against origin/image-queue (attempt ${attempt}/3)"
                ;;
            esac
          done
          echo "::error::could not update the queue after 3 attempts: ${REASON}"
          exit 1
